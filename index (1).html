const app=initializeApp(firebaseConfig),auth=getAuth(app),db=DB_URL?getDatabase(app,DB_URL):getDatabase(app);

const X={
en:{need:"Sign in with Google first.",err:"Something went wrong. Check the room code and your connection."},
fr:{need:"Connectez-vous d’abord avec Google.",err:"Une erreur est survenue. Vérifiez le code et votre connexion."},
ar:{need:"سجّل الدخول عبر Google أولًا.",err:"حدث خطأ. تحقق من الرمز ومن اتصالك."},
ary:{need:"دخل بـ Google الأول.",err:"وقع مشكل. شوف الكود والإنترنت."},
ru:{need:"Сначала войдите через Google.",err:"Ошибка. Проверьте код комнаты и подключение."},
zh:{need:"请先使用 Google 登录。",err:"出错了。请检查房间代码和网络。"},
hi:{need:"पहले Google से साइन इन करें।",err:"कुछ गलत हुआ। कमरे का कोड और कनेक्शन जांचें।"},
it:{need:"Accedi prima con Google.",err:"Qualcosa è andato storto. Controlla il codice e la connessione."}};
Object.keys(X).forEach(k=>Object.assign(T[k],X[k]));

// ---- Google sign-in ----
const prov=new GoogleAuthProvider();
async function login(){try{await signInWithPopup(auth,prov);}catch(e){if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")await signInWithRedirect(auth,prov);else throw e;}}
onAuthStateChanged(auth,u=>{if(u){prof={name:u.displayName||"Player",uid:u.uid,google:true};setHello();if($("acct").classList.contains("on"))show("menu");}});
$("bGoogle").onclick=()=>login().catch(e=>{$("gnote").textContent=T[L].err+" ("+(e.code||e.message)+")";$("gnote").hidden=false;});

// ---- online rooms ----
let ROOM=null,lastSent=[],wasR=false,tm=0,unsubs=[];
const av={};
const rr=p=>ref(db,"rooms/"+ROOM+"/"+p);
function note2(t){$("note").textContent=t;$("note").hidden=false;$("code").hidden=true;}
function needLogin(){if(!auth.currentUser){note2(T[L].need);return true;}return false;}
const keyOf=q=>q.s+"|"+Math.round(q.x)+"|"+Math.round(q.z)+"|"+(q.by||"");
function nameSprite(t){const c=document.createElement("canvas");c.width=256;c.height=64;const g=c.getContext("2d");g.font="bold 30px system-ui,sans-serif";g.textAlign="center";g.fillStyle="rgba(0,0,0,.55)";g.fillRect(0,8,256,48);g.fillStyle="#fff";g.fillText(String(t).slice(0,14),128,43);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));sp.scale.set(4,1,1);sp.position.y=3;return sp;}
function ensureAvatar(id,p){let a=av[id];if(!a){const g=ast.clone(true);g.add(nameSprite(p.nm||"?"));g.position.set(p.x,0,p.z);scene.add(g);a=av[id]={g};}a.tx=p.x;a.tz=p.z;a.ty=p.yaw;a.inR=!!p.inR;}
function tick(){Object.keys(av).forEach(k=>{const a=av[k],g=a.g;g.visible=!a.inR&&run;g.position.x+=(a.tx-g.position.x)*.25;g.position.z+=(a.tz-g.position.z)*.25;g.rotation.y=a.ty;});requestAnimationFrame(tick);}tick();
function listen(){
 unsubs.push(onValue(rr("world/it"),sn=>{const a=sn.val();if(!a||!S)return;const arr=Array.isArray(a)?a:Object.values(a);
  arr.forEach((q,i)=>{const l=S.it[i];if(!l||!q||mine(l))return;l.s=q.s;l.by=q.by||"";l.x=q.x;l.z=q.z;lastSent[i]=keyOf(l);});
  S.rv.w=S.it[0]&&S.it[0].s===2?1:0;S.rv.b=S.it[1]&&S.it[1].s===2?1:0;}));
 unsubs.push(onValue(rr("world/rv"),sn=>{const r=sn.val();if(!r||!S)return;S.rvDrv=r.drv||"";if(!S.inR){S.rv.x=r.x;S.rv.z=r.z;S.rv.yaw=r.yaw;}}));
 unsubs.push(onValue(rr("world/launched"),sn=>{if(sn.val()&&run){run=false;engine(false,0,0);try{document.exitPointerLock();}catch(e){}$("launch").classList.remove("on");show("win");}}));
 const pr=rr("players"),h=sn=>{if(sn.key!==ME)ensureAvatar(sn.key,sn.val());};
 unsubs.push(onChildAdded(pr,h));unsubs.push(onChildChanged(pr,h));
 unsubs.push(onChildRemoved(pr,sn=>{const a=av[sn.key];if(a){scene.remove(a.g);delete av[sn.key];}}));
 onDisconnect(rr("players/"+ME)).remove();
 tm=setInterval(sync,120);}
function sync(){if(!ROOM||!S||!run)return;
 set(rr("players/"+ME),{nm:prof?prof.name:"Player",x:+S.x.toFixed(2),z:+S.z.toFixed(2),yaw:+S.yaw.toFixed(2),inR:!!S.inR});
 S.it.forEach((q,i)=>{const k=keyOf(q);if(lastSent[i]!==k){lastSent[i]=k;update(rr("world/it/"+i),{s:q.s,x:+q.x.toFixed(1),z:+q.z.toFixed(1),by:q.by||""});}});
 if(S.inR){set(rr("world/rv"),{x:+S.x.toFixed(2),z:+S.z.toFixed(2),yaw:+S.yaw.toFixed(2),drv:ME});wasR=true;}
 else if(wasR){set(rr("world/rv"),{x:+S.rv.x.toFixed(2),z:+S.rv.z.toFixed(2),yaw:+S.rv.yaw.toFixed(2),drv:""});wasR=false;}}
function leave(){if(!ROOM)return;clearInterval(tm);unsubs.forEach(f=>f());unsubs=[];try{remove(rr("players/"+ME));}catch(e){}
 Object.keys(av).forEach(k=>{scene.remove(av[k].g);delete av[k];});ROOM=null;ME="";lastSent=[];wasR=false;$("roomTag").style.display="none";}
async function joinRoom(code){try{
 const sn=await get(ref(db,"rooms/"+code+"/world"));if(!sn.exists()){note2(T[L].err);return;}
 const w=sn.val(),it=(Array.isArray(w.it)?w.it:Object.values(w.it||{})).map(q=>({k:q.k,ty:q.ty,x:q.x,z:q.z,s:q.s,by:q.by||""})),rv=w.rv||{};
 leave();ROOM=code;ME=auth.currentUser.uid;
 it.forEach((q,i)=>{lastSent[i]=keyOf(q);});
 const st={x:0,z:16,yaw:0,o2:100,t:0,inR:false,n:w.n,rvDrv:rv.drv||"",rv:{x:rv.x||10,z:rv.z||10,yaw:rv.yaw||0,w:it[0]&&it[0].s===2?1:0,b:it[1]&&it[1].s===2?1:0},it};
 $("roomTag").textContent="🔗 "+code;$("roomTag").style.display="block";
 start(st);listen();
}catch(e){note2(T[L].err+" ("+(e.code||e.message)+")");}}
async function createRoom(){if(needLogin())return;try{
 const code=Array.from({length:4},()=>"ABCDEFGHJKMNPQRSTUVWXYZ"[Math.floor(Math.random()*23)]).join("");
 fresh();
 await set(ref(db,"rooms/"+code),{host:auth.currentUser.uid,world:{n:S.n,launched:false,rv:{x:S.rv.x,z:S.rv.z,yaw:0,drv:""},it:S.it.map(q=>({k:q.k,ty:q.ty||0,x:q.x,z:q.z,s:0,by:""}))}});
 await joinRoom(code);
}catch(e){note2(T[L].err+" ("+(e.code||e.message)+")");}}
$("bCreate").onclick=createRoom;
$("bJoin").onclick=()=>{const c=$("inp").value.trim().toUpperCase();if(!c||needLogin())return;joinRoom(c);};
const menu0=$("menuBtn").onclick;$("menuBtn").onclick=()=>{menu0();leave();};
const launch0=$("launch").onclick;$("launch").onclick=()=>{if(ROOM)set(rr("world/launched"),true);launch0();};
</script>
</body></html>
